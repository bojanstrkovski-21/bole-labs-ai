# Codex defaults for this setup. Seeded to ~/.codex/config.toml by install.sh
# only when no config exists; after that the installed file belongs to you.
# Model, MCP servers, and project trust are intentionally unset: choose them
# per machine, and add trusted projects through Codex itself.

approval_policy = "on-request"
sandbox_mode = "workspace-write"

[tui]
status_line = ["model-with-reasoning", "current-dir", "git-branch"]
