# Profile for a local llama.cpp server. Select it with `codex --profile llamacpp`.
# Start the server with an OpenAI Responses-compatible endpoint first:
#   llama-server --model /path/to/model.gguf --jinja --port 8080
# `model` is an API identifier; set it to whatever name your server expects, or
# override it for one run with `--model`.

model = "local-model"
model_provider = "local_llamacpp"

[model_providers.local_llamacpp]
name = "Local llama.cpp"
base_url = "http://127.0.0.1:8080/v1"
wire_api = "responses"
